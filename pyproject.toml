[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsquant"
version = "0.1.0"
description = "Replicable systematic equity research pipeline inspired by what Two Sigma's SEC filings disclose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7"]

[project.scripts]
tsquant = "tsquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
